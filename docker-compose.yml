services:

  # ─── API Laravel ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ppgfood_api
    volumes:
      - ./:/var/www
    working_dir: /var/www
    depends_on:
      - mysql
      - redis
    networks:
      - ppgfood_net
      - proxy_net

  nginx:
    image: nginx:alpine
    container_name: ppgfood_api_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/api.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - api
    networks:
      - ppgfood_net
      - proxy_net

  # ─── Websocket (Laravel Echo Server) ──────────────────────────────
  echo:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: ppgfood_echo
    ports:
      - "6001:6001"
    depends_on:
      - redis
    networks:
      - ppgfood_net

  # ─── Banco de dados ───────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ppgfood_mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-ppgfood}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-ppgfood}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "3310:3306"
    volumes:
      - ppgfood_mysql_data:/var/lib/mysql
    networks:
      - ppgfood_net

  redis:
    image: redis:7-alpine
    container_name: ppgfood_redis
    networks:
      - ppgfood_net

networks:
  ppgfood_net:
    driver: bridge
  proxy_net:
    external: true

volumes:
  ppgfood_mysql_data:
